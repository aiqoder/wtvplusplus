<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一个橙子pro</title>
  <style>
    /**
 * Loading animation like the one seen on http://www.freeger.com/projects/contextad/ with CSS
 * Caveat: Not DRY. The content needs to be repeated in a data- attribute (or directly in the CSS).
 */

    body {
      background: #ccc51c;
      min-height: 100%;
    }

    h1 {
      position: absolute;
      left: 50%;
      margin-left: -1.9em;
      color: hsla(0, 0%, 100%, .3);
      font: 900 800% Baskerville, 'Palatino Linotype', Palatino, serif;
    }

    @keyframes loading {
      from {
        max-width: 0;
      }
    }

    h1:before {
      content: attr(data-content);
      position: absolute;
      overflow: hidden;
      max-width: 7em;
      color: white;
      animation: loading 10s linear;
    }
  </style>
</head>

<body>
  <h1 data-content="czpro">czpro</h1>
</body>

</html>
