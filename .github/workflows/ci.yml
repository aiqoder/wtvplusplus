name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Build frontend
        run: npm run build:wails:frontend

  go:
    name: Go Checks
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go packages
        run: go test ./...

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l main.go services internal)
          if [ -n "$files" ]; then
            echo "以下 Go 文件未经过 gofmt："
            echo "$files"
            exit 1
          fi

      - name: Check diff whitespace
        run: git diff --check
