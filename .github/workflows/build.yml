name: Build Wails Application

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      version:
        description: '可选版本号，例如 1.4.1'
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$VER"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Sync package.json version
        run: npm pkg set "version=${{ env.APP_VERSION }}"

      - name: Build frontend
        run: npm run build:wails:frontend
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 5

  macos:
    name: macOS arm64 Wails Build
    runs-on: macos-14
    needs: frontend
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          VER="${VER#v}"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$VER"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails 3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Sync version metadata
        shell: bash
        run: |
          npm pkg set "version=${APP_VERSION}"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("build/config.yml")
          text = path.read_text()
          ver = os.environ["APP_VERSION"]
          text, n = re.subn(r'(?m)^(  version:\s*)".*"$', rf'\1"{ver}"', text, count=1)
          if n != 1:
              raise SystemExit("failed to patch build/config.yml version")
          path.write_text(text)
          PY

      - name: Build frontend
        run: npm run build:wails:frontend
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Build Wails application
        run: wails3 build
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtvplusplus-macos-arm64
          path: |
            bin/wtv
            bin/ffmpeg/lib
          if-no-files-found: error
          retention-days: 5

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/wtv
            bin/ffmpeg/lib/*.dylib
